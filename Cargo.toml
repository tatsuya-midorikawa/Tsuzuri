[package]
name = "tsuzuri"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A small, statically typed language with ownership and LLVM native and WebAssembly backends"
license = "Apache-2.0"
repository = "https://github.com/tatsuya-midorikawa/Tsuzuri"

[dependencies]
rustc_apfloat = "0.2"
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
same-file = "1.0.6"

[profile.dev]
# The test suites compile generated programs and run mutation fuzzers in this profile. On an M1 Max, opt-level 1
# with line tables took `cargo test` from 22 to 6 minutes and halved target/. `--profile debugging` keeps full
# debug information for lldb.
opt-level = 1
debug = "line-tables-only"

[profile.debugging]
inherits = "dev"
opt-level = 0
debug = "full"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
