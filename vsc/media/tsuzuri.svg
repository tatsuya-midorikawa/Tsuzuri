<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Tsuzuri</title>
  <desc id="description">The primary Tsuzuri mark: two blue code brackets interlaced like threads binding a written work.</desc>
  <defs>
    <mask id="lower-thread" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="white"/>
      <path d="M208 312 304 360" stroke="black" stroke-width="80"/>
    </mask>
    <mask id="upper-thread" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="white"/>
      <path d="M208 152 304 200" stroke="black" stroke-width="80"/>
    </mask>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="#FBFDFF"/>
  <rect x="17" y="17" width="478" height="478" rx="107" stroke="#DCE6F5" stroke-width="2"/>
  <path d="M160 128 384 240Q408 256 384 272L160 384" stroke="#2459D5" stroke-width="56" stroke-linecap="round" stroke-linejoin="round" mask="url(#lower-thread)"/>
  <path d="M352 128 128 240Q104 256 128 272L352 384" stroke="#69B8F5" stroke-width="56" stroke-linecap="round" stroke-linejoin="round" mask="url(#upper-thread)"/>
</svg>
