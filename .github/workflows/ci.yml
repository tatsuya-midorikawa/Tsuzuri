name: Tsuzuri CI

# The gate of a pull request, on five Linux jobs that run in parallel (15 to 22 minutes in all, November 2026):
#   lint    formatting, lints, a type check of the other four supported platforms, and the platform contracts;
#   rust    the Rust tests (cargo-nextest; the dev profile of Cargo.toml is opt-level 1), in three slices of the whole list
#           (`--partition slice:N/3`, which deals the tests of every binary round-robin), each building the tests itself;
#   suites  the end-to-end suites that a compiler change breaks most often, run on the dev binary.
# targets.yml, windows.yml and vscode.yml are the slow matrices: they run after every merge to main and, on a pull request,
# with the label `ci:full`. The user language reference lives in Tsuzuri-Reference.

on:
  workflow_dispatch:
  # Everything the Rust tests and the suites build or read: tests embed benchmarks/, guide/ and scripts/ with include_str!,
  # and read docs/ at run time.
  pull_request:
    paths:
      - src/**
      - std/**
      - tests/**
      - examples/**
      - scripts/**
      - benchmarks/**
      - guide/**
      - docs/**
      - Cargo.*
      - .config/**
      - .github/workflows/**
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: ${{ matrix.group }}${{ matrix.slice && format(' ({0}/{1})', matrix.slice, matrix.slices) || '' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: lint
          - group: rust
            slice: 1
            slices: 3
          - group: rust
            slice: 2
            slices: 3
          - group: rust
            slice: 3
            slices: 3
          - group: suites
    # A slice of the Rust tests takes about 15 minutes on a hosted ubuntu-24.04 runner and suites about 15 (November 2026,
    # about 3,300 tests); slower hardware takes up to twice as long. The limit only stops a hung job: it is not a speed check.
    timeout-minutes: 60
    env:
      TSUZURI_CLANG: /usr/lib/llvm-21/bin/clang
      TSUZURI_WASM_LD: /usr/lib/llvm-21/bin/wasm-ld
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc, aarch64-pc-windows-msvc, aarch64-unknown-linux-gnu, aarch64-apple-darwin
      # lint also fetches the crates of the other four platforms; the first job of a key to finish saves it.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ci-${{ runner.os }}-${{ runner.arch }}-${{ matrix.group == 'lint' && 'lint' || 'host' }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ci-${{ runner.os }}-${{ runner.arch }}-${{ matrix.group == 'lint' && 'lint' || 'host' }}-
      - uses: actions/cache@v4
        id: nextest
        if: matrix.group == 'rust'
        with:
          path: ~/.cargo/bin/cargo-nextest
          key: nextest-0.9.148-${{ runner.os }}-${{ runner.arch }}
      - name: cargo-nextest
        if: matrix.group == 'rust' && steps.nextest.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-nextest --version 0.9.148
      # LLVM 21 as in targets.yml: the system Clang that builds the programs of the tests. lint compiles no program.
      - name: LLVM on Linux
        if: matrix.group != 'lint'
        run: |
          sudo -n apt-get update
          sudo -n apt-get install -y ca-certificates wget gnupg patchelf
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor | sudo -n tee /usr/share/keyrings/llvm.gpg >/dev/null
          printf 'deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main\n' | sudo -n tee /etc/apt/sources.list.d/llvm21.list >/dev/null
          sudo -n apt-get update
          sudo -n apt-get install -y clang-21 lld-21 lldb-21 llvm-21 libclang-rt-21-dev
      - name: Format
        if: matrix.group == 'lint'
        run: cargo fmt --all -- --check
      - name: Clippy
        if: ${{ !cancelled() && matrix.group == 'lint' }}
        run: cargo clippy --locked --all-targets -- -D warnings
      # Linux x64 is checked by Clippy above; the other four platforms are compiled here, not run.
      - name: Type check of all supported platforms
        if: ${{ !cancelled() && matrix.group == 'lint' }}
        run: |
          cargo check --locked --all-targets --target x86_64-pc-windows-msvc
          cargo check --locked --all-targets --target aarch64-pc-windows-msvc
          cargo check --locked --all-targets --target aarch64-unknown-linux-gnu
          cargo check --locked --all-targets --target aarch64-apple-darwin
      - name: Supported platform and distribution contracts
        if: ${{ !cancelled() && matrix.group == 'lint' }}
        run: node tests/platforms.mjs
      # Four MiB per test thread, as in targets.yml and windows.yml. Each slice lists every test and runs its share.
      - name: Rust tests
        if: ${{ !cancelled() && matrix.group == 'rust' }}
        env:
          RUST_MIN_STACK: "4194304"
        run: cargo nextest run --locked --profile ci --partition slice:${{ matrix.slice }}/${{ matrix.slices }}
      - name: Dev binary
        id: build
        if: ${{ !cancelled() && matrix.group == 'suites' }}
        run: cargo build --locked
      - name: Slot script
        if: ${{ !cancelled() && matrix.group == 'suites' }}
        run: node tests/slot.mjs
      - name: LLDB collection views and stepping
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          TSUZURI_LLDB: /usr/lib/llvm-21/bin/lldb
          TMPDIR: ${{ github.workspace }}/target/scratch/debugger/tmp
          TSUZURI_SLOT_DIR: ${{ github.workspace }}/target/scratch/debugger/slots
          TSUZURI_CACHE_DIR: ${{ github.workspace }}/target/scratch/debugger/cache
        run: |
          mkdir -p "$TMPDIR"
          node scripts/slot.mjs -- node tests/debugger.mjs target/debug/tsuzuri
      - name: End-to-end compiler tests (e2e)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/e2e.mjs target/debug/tsuzuri
      - name: Tensor files (NC11)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          node scripts/slot.mjs -- node tests/features.mjs target/debug/tsuzuri tensor_codec
          node scripts/slot.mjs -- node tests/tensor_io.mjs target/debug/tsuzuri
      - name: Numeric libraries (NC09, NC10)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          node scripts/slot.mjs -- node tests/features.mjs target/debug/tsuzuri fft
          node scripts/slot.mjs -- node tests/features.mjs target/debug/tsuzuri polynomial
          node scripts/slot.mjs -- node tests/features.mjs target/debug/tsuzuri random
          node scripts/slot.mjs -- node tests/features.mjs target/debug/tsuzuri random_tensor
      - name: Ordered containers
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          TMPDIR: ${{ github.workspace }}/target/scratch/debugger/tmp
          TSUZURI_CACHE_DIR: ${{ github.workspace }}/target/scratch/debugger/cache
        run: |
          mkdir -p "$TMPDIR"
          node scripts/slot.mjs -- node tests/features.mjs target/debug/tsuzuri map_set
          node scripts/slot.mjs -- node tests/features.mjs target/debug/tsuzuri map_set_chunks
      # TZ02: tzroutine { } and Routine, end to end, and the exports of tests/fixtures/tzroutine with live == 0. TZ03: Channel
      # between tzroutines and threads at 1 and 4 Ps (native), and the one-thread Channel of the default WebAssembly target.
      # TZ04: select, the same two ways. TZ05: the timers (native). TZ06: the sync types, at 1 and 4 Ps and on the one
      # thread of the default WebAssembly target. TZ07: Context and ErrGroup (native). TZ11: Parallel on the scheduler
      # and Routine.scope (native). TZ12: the value cases of the removed Task, on Routine.scope (tzroutine_values). TZ09: the
      # tzroutines of wasm32 with --wasm-feature jspi (the same fixtures through the generated glue, on Node.js 24). TZ10:
      # tzroutine.mjs runs tests/fixtures/preemption with 1 and 4 Ps (the checks of Phase 1 and the SIGURG stops of Phase 2;
      # counts, never times).
      - name: tzroutine, Channel, select, timers, sync, Context and Parallel (TZ02 to TZ07, TZ09 to TZ11)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          node scripts/slot.mjs -- node tests/tzroutine.mjs target/debug/tsuzuri
          node scripts/slot.mjs -- node tests/tzroutine_wasm.mjs target/debug/tsuzuri
          node scripts/slot.mjs -- node tests/features.mjs target/debug/tsuzuri tzroutine
          node scripts/slot.mjs -- node tests/features.mjs target/debug/tsuzuri tzroutine_values
          node scripts/slot.mjs -- node tests/features.mjs target/debug/tsuzuri channel
          node scripts/slot.mjs -- node tests/features.mjs target/debug/tsuzuri channel_single
          node scripts/slot.mjs -- node tests/features.mjs target/debug/tsuzuri select
          node scripts/slot.mjs -- node tests/features.mjs target/debug/tsuzuri select_single
          node scripts/slot.mjs -- node tests/features.mjs target/debug/tsuzuri timers
          node scripts/slot.mjs -- node tests/features.mjs target/debug/tsuzuri sync_types
          node scripts/slot.mjs -- node tests/features.mjs target/debug/tsuzuri sync_single
          node scripts/slot.mjs -- node tests/features.mjs target/debug/tsuzuri context
          node scripts/slot.mjs -- node tests/features.mjs target/debug/tsuzuri parallel_scheduler
      - name: Primitive types
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/primitives.mjs target/debug/tsuzuri
      - name: Examples
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/examples.mjs target/debug/tsuzuri
      - name: Control flow and ownership cleanup
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/control.mjs target/debug/tsuzuri
      - name: FFI extensions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          node tests/ffi_extensions.mjs target/debug/tsuzuri
          node tests/c_layout.mjs target/debug/tsuzuri
          node tests/c_layout_by_value.mjs target/debug/tsuzuri
          node tests/extern_view.mjs target/debug/tsuzuri
      - name: Computation expressions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/computations.mjs target/debug/tsuzuri
      - name: JSON conformance
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/json.mjs target/debug/tsuzuri
