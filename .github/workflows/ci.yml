name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Install LLVM on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang lld
      - name: Install LLVM on macOS
        if: runner.os == 'macOS'
        run: |
          brew install llvm lld
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
      - name: Rust checks
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
          cargo build --release --locked
      - name: Native and WebAssembly behavior
        run: |
          node tests/e2e.mjs target/release/tsuzuri
          node tests/primitives.mjs target/release/tsuzuri
          node tests/tasks.mjs target/release/tsuzuri
          node tests/computations.mjs target/release/tsuzuri
          node tests/numeric_casts.mjs target/release/tsuzuri
      - name: Application examples
        run: node tests/examples.mjs target/release/tsuzuri
      - name: Benchmark correctness smoke
        run: |
          node benchmarks/run.mjs target/release/tsuzuri 100000
          node benchmarks/run-cpp.mjs target/release/tsuzuri --quick
          node benchmarks/run-cpp.mjs target/release/tsuzuri --quick --cpu native
          node benchmarks/run-computations.mjs target/release/tsuzuri --quick

  minimum-rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check the minimum supported Rust
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          cargo +1.85.0 check --locked --all-targets
