name: Tsuzuri CI

# The gate of a pull request, on one Linux host in about 20 minutes: formatting, lints, the Rust tests (cargo-nextest; the
# dev profile of Cargo.toml is opt-level 1), a type check of all five supported platforms, and the end-to-end suites that a compiler
# change breaks most often, run on the dev binary. targets.yml, windows.yml and vscode.yml are the slow matrices: they run
# after every merge to main and, on a pull request, with the label `ci:full`. reference.yml checks the language reference.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/**
      - std/**
      - tests/**
      - examples/**
      - scripts/**
      - Cargo.*
      - .config/**
      - .github/workflows/**
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TSUZURI_CLANG: /usr/lib/llvm-21/bin/clang
      TSUZURI_WASM_LD: /usr/lib/llvm-21/bin/wasm-ld
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc, aarch64-pc-windows-msvc, aarch64-unknown-linux-gnu, aarch64-apple-darwin
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ci-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ci-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/cache@v4
        id: nextest
        with:
          path: ~/.cargo/bin/cargo-nextest
          key: nextest-0.9.148-${{ runner.os }}-${{ runner.arch }}
      - name: cargo-nextest
        if: steps.nextest.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-nextest --version 0.9.148
      # LLVM 21 as in targets.yml: the system Clang that builds the programs of the tests.
      - name: LLVM on Linux
        run: |
          sudo -n apt-get update
          sudo -n apt-get install -y ca-certificates wget gnupg patchelf
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor | sudo -n tee /usr/share/keyrings/llvm.gpg >/dev/null
          printf 'deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main\n' | sudo -n tee /etc/apt/sources.list.d/llvm21.list >/dev/null
          sudo -n apt-get update
          sudo -n apt-get install -y clang-21 lld-21 lldb-21 llvm-21 libclang-rt-21-dev
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --locked --all-targets -- -D warnings
      # Linux x64 is checked by Clippy above; the other four platforms are compiled here, not run.
      - name: Type check of all supported platforms
        if: ${{ !cancelled() }}
        run: |
          cargo check --locked --all-targets --target x86_64-pc-windows-msvc
          cargo check --locked --all-targets --target aarch64-pc-windows-msvc
          cargo check --locked --all-targets --target aarch64-unknown-linux-gnu
          cargo check --locked --all-targets --target aarch64-apple-darwin
      - name: Supported platform and distribution contracts
        if: ${{ !cancelled() }}
        run: node tests/platforms.mjs
      # Four MiB per test thread, as in targets.yml and windows.yml.
      - name: Rust tests
        if: ${{ !cancelled() }}
        env:
          RUST_MIN_STACK: "4194304"
        run: cargo nextest run --locked --profile ci
      - name: Dev binary
        id: build
        if: ${{ !cancelled() }}
        run: cargo build --locked
      - name: Slot script
        if: ${{ !cancelled() }}
        run: node tests/slot.mjs
      - name: LLDB collection views and stepping
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          TSUZURI_LLDB: /usr/lib/llvm-21/bin/lldb
          TMPDIR: ${{ github.workspace }}/target/scratch/debugger/tmp
          TSUZURI_SLOT_DIR: ${{ github.workspace }}/target/scratch/debugger/slots
          TSUZURI_CACHE_DIR: ${{ github.workspace }}/target/scratch/debugger/cache
        run: |
          mkdir -p "$TMPDIR"
          node scripts/slot.mjs -- node tests/debugger.mjs target/debug/tsuzuri
      - name: End-to-end compiler tests (e2e)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/e2e.mjs target/debug/tsuzuri
      - name: Ordered containers
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          TMPDIR: ${{ github.workspace }}/target/scratch/debugger/tmp
          TSUZURI_CACHE_DIR: ${{ github.workspace }}/target/scratch/debugger/cache
        run: |
          mkdir -p "$TMPDIR"
          node scripts/slot.mjs -- node tests/features.mjs target/debug/tsuzuri map_set
          node scripts/slot.mjs -- node tests/features.mjs target/debug/tsuzuri map_set_chunks
      - name: Primitive types
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/primitives.mjs target/debug/tsuzuri
      - name: Examples
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/examples.mjs target/debug/tsuzuri
      - name: Control flow and ownership cleanup
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/control.mjs target/debug/tsuzuri
      - name: Computation expressions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/computations.mjs target/debug/tsuzuri
      - name: JSON conformance
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/json.mjs target/debug/tsuzuri
