name: Repo KB

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: repo-kb-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repo-kb:
    name: repo-kb (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Tests of the knowledge base
        run: node tests/repo_kb.mjs
      - name: Build and verify
        run: |
          node scripts/repo-kb.mjs build
          node scripts/repo-kb.mjs verify
      - name: GUIDE-LITE references
        run: node scripts/check-guide-lite.mjs
