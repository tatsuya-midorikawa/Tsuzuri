name: Tsuzuri targets

# G15: native targets named with `--target TRIPLE`, cross-linked with the bundled Zig toolchain, and
# the compiler's tests on the three Linux/macOS hosts that ship a toolchain bundle. The documentation's tier table
# (_tsuzuri/language-reference/compiler/platforms.md) may claim only what a step of this file checks:
#   - "executed on a matching runner":  the host's own triple, run by tests/targets.mjs on each job;
#   - "executed through an emulator":   the static musl triples, run by qemu-user on the Linux jobs;
#   - "linked and inspected":           the triples that the Zig bundle links, whose headers are read back;
#   - "object only":                    the triples without a C library in the bundle.
# Windows hosts are not here: tests/windows.rs, tests/windows.mjs and vscode.yml cover them.
# These three hosts run after every merge to main that changes the compiler and, on a pull request, with the label `ci:full`
# (ci.yml is the gate of every pull request).

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - src/**
      - std/**
      - tests/**
      - benchmarks/**
      - Cargo.*
      - scripts/toolchain/**
      - spec/**
      - scripts/conformance.mjs
      - scripts/conformance/**
      - scripts/check-spec.mjs
      - .github/workflows/targets.yml
  pull_request:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: read

# An event for some other label gets a group of its own, so that it cancels nothing (a run with `ci:full` takes about two
# hours); its job is skipped below. A pull request event without the label is skipped too, in the group of its own.
concurrency:
  group: targets-${{ github.ref }}-${{ (github.event.action == 'labeled' && github.event.label.name != 'ci:full') && 'other-label' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  targets:
    if: ${{ github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'ci:full') && (github.event.action != 'labeled' || github.event.label.name == 'ci:full')) }}
    name: targets (${{ matrix.host }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            host: darwin-arm64
            f16: hardware
          - os: ubuntu-24.04
            host: linux-x64
            f16: generic=soft,native=conversions|hardware
          - os: ubuntu-24.04-arm
            host: linux-arm64
            f16: hardware
    runs-on: ${{ matrix.os }}
    # The fast backend and the compact-string Rust tests on linux-x64 have step-specific limits too.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      # The crates, and the Zig archive that scripts/toolchain/bundle.mjs downloads (it verifies the
      # pinned SHA-256 whether or not the file came from here).
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/vsc-downloads
          key: targets-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'scripts/toolchain/bundle.mjs') }}
          restore-keys: targets-${{ runner.os }}-${{ runner.arch }}-
      - name: Check host architecture
        env:
          EXPECTED_HOST: ${{ matrix.host }}
        run: node -e 'if (`${process.platform}-${process.arch}` !== process.env.EXPECTED_HOST) process.exit(1)'
      - name: Supported hosts and Apple Silicon-only macOS
        run: node tests/platforms.mjs
      # LLVM 21 as in vscode.yml: the system Clang that builds the host's programs and every object, and
      # what the bundle copies. The Linux jobs also install qemu-user, which runs the foreign static
      # musl executables through TSUZURI_RUNNER; nothing is downloaded by the tests themselves.
      - name: LLVM on macOS
        if: runner.os == 'macOS'
        run: |
          brew install llvm@21 lld
          printf 'LLVM_PREFIX=%s\n' "$(brew --prefix llvm@21)" >> "$GITHUB_ENV"
          printf 'TSUZURI_WASM_LD=%s/bin/wasm-ld\n' "$(brew --prefix lld)" >> "$GITHUB_ENV"
      - name: LLVM and qemu-user on Linux
        if: runner.os == 'Linux'
        run: |
          sudo -n apt-get update
          sudo -n apt-get install -y ca-certificates wget gnupg patchelf
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor | sudo -n tee /usr/share/keyrings/llvm.gpg >/dev/null
          printf 'deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main\n' | sudo -n tee /etc/apt/sources.list.d/llvm21.list >/dev/null
          sudo -n apt-get update
          sudo -n apt-get install -y clang-21 lld-21 llvm-21 libclang-rt-21-dev qemu-user
          printf 'LLVM_PREFIX=/usr/lib/llvm-21\n' >> "$GITHUB_ENV"
      # target/release/tsuzuri (cargo build --release --locked) and target/toolchain: the compiler, the
      # launcher tsuzuri-clang, LLVM's clang, and Zig, laid out as the VS Code extension ships them.
      - name: Build the compiler and the bundled toolchain
        id: bundle
        run: node scripts/toolchain/bundle.mjs target/toolchain
      # Each of the nine triples reports "executed", "linked only" or "object only". The opt-in
      # variables make a missing cross toolchain or emulator a failure here instead of a skip:
      #   TSUZURI_CROSS_LINK=1     link every target the bundled Zig can link (needs TSUZURI_CROSS_CLANG);
      #   TSUZURI_CROSS_EXECUTE=1  run the static musl targets of the other architectures under qemu-user.
      - name: Targets
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: |
          export TSUZURI_CLANG="$LLVM_PREFIX/bin/clang"
          export TSUZURI_WASM_LD="${TSUZURI_WASM_LD:-$LLVM_PREFIX/bin/wasm-ld}"
          export TSUZURI_CROSS_LINK=1
          export TSUZURI_CROSS_CLANG="$PWD/target/toolchain/bin/tsuzuri-clang"
          if [ "$RUNNER_OS" = Linux ]; then export TSUZURI_CROSS_EXECUTE=1; fi
          node tests/targets.mjs target/release/tsuzuri
      - name: End-to-end compiler tests
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: |
          export TSUZURI_CLANG="$LLVM_PREFIX/bin/clang"
          export TSUZURI_WASM_LD="${TSUZURI_WASM_LD:-$LLVM_PREFIX/bin/wasm-ld}"
          node tests/e2e.mjs target/release/tsuzuri
      - name: Language conformance suite
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: |
          export TSUZURI_CLANG="$LLVM_PREFIX/bin/clang"
          export TSUZURI_WASM_LD="${TSUZURI_WASM_LD:-$LLVM_PREFIX/bin/wasm-ld}"
          node scripts/conformance.mjs target/release/tsuzuri --jobs 2
          node tests/conformance_harness.mjs target/release/tsuzuri
      # G34: the examples of `///` (the fixture of tests/doctest.rs, and every public std function).
      - name: Documentation examples
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: |
          export TSUZURI_CLANG="$LLVM_PREFIX/bin/clang"
          target/release/tsuzuri test --doc tests/fixtures/doctest/pass
          target/release/tsuzuri test --doc std -O0
          target/release/tsuzuri test --doc std -O3
      # D14: Text.f and Regex.*_text give the values of the direct calls (JavaScript references), and each Text
      # instance method is a single direct call.
      - name: Text class (D14) - values against JavaScript references, instance methods are single direct calls
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: |
          export TSUZURI_CLANG="$LLVM_PREFIX/bin/clang"
          export TSUZURI_WASM_LD="${TSUZURI_WASM_LD:-$LLVM_PREFIX/bin/wasm-ld}"
          node tests/features.mjs target/release/tsuzuri text_class
          node tests/features.mjs target/release/tsuzuri regex_text
          node tests/text_class.mjs target/release/tsuzuri
      - name: Memory and LLVM fact semantics
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        env:
          TSUZURI_CACHE_DIR: ${{ github.workspace }}/target/phase2-cache
        run: |
          export TSUZURI_CLANG="$LLVM_PREFIX/bin/clang"
          export TSUZURI_WASM_LD="${TSUZURI_WASM_LD:-$LLVM_PREFIX/bin/wasm-ld}"
          node tests/features.mjs target/release/tsuzuri storage
          node tests/features.mjs target/release/tsuzuri last_use
          node tests/features.mjs target/release/tsuzuri param_facts
          node tests/features.mjs target/release/tsuzuri list_chunks
          node tests/features.mjs target/release/tsuzuri map_set_chunks
      # PM02: a function value or a Task is { descriptor, environment }. primitives.mjs runs the four kinds of function value
      # through a C host that asserts live == 0; debugger_static.mjs asks the LLDB formatter about the DWARF types of a -g build
      # without running a process (LLDB is on the macOS runners only).
      - name: Function values and tasks (PM02)
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        timeout-minutes: 30
        run: |
          export TSUZURI_CLANG="$LLVM_PREFIX/bin/clang"
          export TSUZURI_WASM_LD="${TSUZURI_WASM_LD:-$LLVM_PREFIX/bin/wasm-ld}"
          node tests/primitives.mjs target/release/tsuzuri
          node tests/tasks.mjs target/release/tsuzuri
          if [ "$RUNNER_OS" = macOS ]; then node tests/debugger_static.mjs target/release/tsuzuri; fi
      # E14 and B10: trap boundaries and failure domains. trap_return.mjs builds C hosts of --trap-mode return objects and IR
      # and the runtime's own unit tests (tests/trap_boundary_runtime.c, tests/domain_runtime.c); domain.mjs runs Domain.run
      # through run, build and test and a C host that alternates 10,000 successes and traps with no block left alive;
      # trap_boundary.mjs runs the WebAssembly boundary and its frames in Node. The sanitizer builds are left out on macOS,
      # whose Homebrew LLVM builds sanitizer programs that never start (see the size-class allocator step below).
      - name: Trap boundaries and failure domains (E14, B10)
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        timeout-minutes: 30
        run: |
          export TSUZURI_CLANG="$LLVM_PREFIX/bin/clang"
          export TSUZURI_WASM_LD="${TSUZURI_WASM_LD:-$LLVM_PREFIX/bin/wasm-ld}"
          if [ "$RUNNER_OS" = macOS ]; then export TSUZURI_NO_SANITIZERS=1; fi
          node tests/trap_return.mjs target/release/tsuzuri
          node tests/domain.mjs target/release/tsuzuri
          node tests/trap_boundary.mjs target/release/tsuzuri
      # PM09: the calls between the functions of one recursion are guaranteed tail calls. tests/stack.mjs runs a mutual recursion of ten
      # million calls natively and in V8 (with --wasm-feature tail-call), and checks that the default WebAssembly build has no tail call.
      # llvm-objdump counts the return_call instructions. The same suite runs again with the fast backend below.
      - name: Stack depth and guaranteed tail calls (PM09)
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        timeout-minutes: 20
        run: |
          export TSUZURI_CLANG="$LLVM_PREFIX/bin/clang"
          export TSUZURI_WASM_LD="${TSUZURI_WASM_LD:-$LLVM_PREFIX/bin/wasm-ld}"
          export TSUZURI_OBJDUMP="$LLVM_PREFIX/bin/llvm-objdump"
          node tests/stack.mjs target/release/tsuzuri
      # PM05: the WASM heap alone, the unit tests of the size-class allocator (plain, ASan+UBSan, TSan), --allocator small end
      # to end, and the vec and storage suites with every block of the size classes accounted for.
      - name: WASM heap and size-class allocator
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: |
          export TSUZURI_CLANG="$LLVM_PREFIX/bin/clang"
          export TSUZURI_WASM_LD="${TSUZURI_WASM_LD:-$LLVM_PREFIX/bin/wasm-ld}"
          export TSUZURI_OBJDUMP="$LLVM_PREFIX/bin/llvm-objdump"
          # Linux runs the unit tests with ASan+UBSan and TSan (libclang-rt-21-dev above). The Homebrew LLVM 21 of the macOS
          # runners builds sanitizer programs that never start (an empty AddressSanitizer program hangs, a ThreadSanitizer
          # one dies with SIGSEGV; vscode.yml leaves them out of the Net tests for the same reason), so macOS runs them
          # without sanitizers: the plain and -O3 unit tests, which always run, decide there.
          if [ "$RUNNER_OS" = macOS ]; then export TSUZURI_NO_SANITIZERS=1; fi
          node tests/wasm_heap.mjs
          node tests/small_allocator.mjs target/release/tsuzuri
          TSUZURI_TEST_ALLOCATOR=small node tests/features.mjs target/release/tsuzuri vec
          TSUZURI_TEST_ALLOCATOR=small node tests/features.mjs target/release/tsuzuri storage
          TSUZURI_TEST_ALLOCATOR=small node tests/features.mjs target/release/tsuzuri list_chunks
      - name: Last-use differential fuzz smoke
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: |
          export TSUZURI_CLANG="$LLVM_PREFIX/bin/clang"
          node tests/last_use_fuzz.mjs target/release/tsuzuri 40 1 4
      - name: Integer range proofs (audit mode and differential fuzz)
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: |
          export TSUZURI_CLANG="$LLVM_PREFIX/bin/clang"
          export TSUZURI_WASM_LD="${TSUZURI_WASM_LD:-$LLVM_PREFIX/bin/wasm-ld}"
          TSUZURI_RANGE_FLAGS=audit node tests/control.mjs target/release/tsuzuri
          TSUZURI_RANGE_FLAGS=proven node tests/control.mjs target/release/tsuzuri
          node tests/integer_ranges_fuzz.mjs target/release/tsuzuri 20 1 3
      - name: UTF SIMD and scalar fallbacks
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: |
          export TSUZURI_CLANG="$LLVM_PREFIX/bin/clang"
          export TSUZURI_OBJDUMP="$LLVM_PREFIX/bin/llvm-objdump"
          node tests/utf_simd.mjs --quick
      # PM03: the compact (Latin-1) string form, which TSUZURI_STRINGS=compact selects, against independent references: the raw
      # runtime functions, every form pair of every string operation compiled in both modes, the LLDB formatter without a
      # live session, and the existing string suites run in both modes.
      - name: Compact strings (PM03)
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        timeout-minutes: 40
        run: |
          export TSUZURI_CLANG="$LLVM_PREFIX/bin/clang"
          export TSUZURI_WASM_LD="${TSUZURI_WASM_LD:-$LLVM_PREFIX/bin/wasm-ld}"
          export TSUZURI_OBJDUMP="$LLVM_PREFIX/bin/llvm-objdump"
          node tests/compact_strings_raw.mjs target/release/tsuzuri --quick
          node tests/compact_strings.mjs target/release/tsuzuri --quick
          python3 tests/lldb_strings.py
          python3 tests/lldb_lists.py
          node tests/compact_strings_modes.mjs target/release/tsuzuri quick compact utf16
      - name: Prebuilt runtime cache and fallback
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: |
          export TSUZURI_CLANG="$LLVM_PREFIX/bin/clang"
          export TSUZURI_WASM_LD="${TSUZURI_WASM_LD:-$LLVM_PREFIX/bin/wasm-ld}"
          node tests/prebuilt_runtime.mjs target/release/tsuzuri
      - name: Size levels and artifact size
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: |
          export TSUZURI_CLANG="$LLVM_PREFIX/bin/clang"
          export TSUZURI_WASM_LD="${TSUZURI_WASM_LD:-$LLVM_PREFIX/bin/wasm-ld}"
          node tests/size.mjs target/release/tsuzuri
      - name: Integer text against a Python reference
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: |
          export TSUZURI_CLANG="$LLVM_PREFIX/bin/clang"
          export TSUZURI_WASM_LD="${TSUZURI_WASM_LD:-$LLVM_PREFIX/bin/wasm-ld}"
          node tests/integer_format.mjs
      - name: Handoff to Clang (PB03) - pruning, C runtime cache, linker choice, bundle identity
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: |
          export TSUZURI_CLANG="$LLVM_PREFIX/bin/clang"
          export TSUZURI_WASM_LD="${TSUZURI_WASM_LD:-$LLVM_PREFIX/bin/wasm-ld}"
          node tests/llvm_handoff.mjs target/release/tsuzuri
          node tests/handoff_tools.mjs target/release/tsuzuri
          node tests/bundle_identity.mjs target/release/tsuzuri
      # PR07: --profile-generate and --profile-use. LLVM_PREFIX turns every skip of tests/pgo.mjs into a failure, so the Clang here
      # must have its profile runtime (libclang-rt-21-dev on Linux) and sit next to llvm-profdata.
      - name: Profile-guided optimization (PR07)
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        timeout-minutes: 30
        run: |
          export TSUZURI_CLANG="$LLVM_PREFIX/bin/clang"
          export TSUZURI_WASM_LD="${TSUZURI_WASM_LD:-$LLVM_PREFIX/bin/wasm-ld}"
          node tests/pgo.mjs target/release/tsuzuri
      - name: Numeric display and parse references
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: |
          export TSUZURI_CLANG="$LLVM_PREFIX/bin/clang"
          export TSUZURI_WASM_LD="${TSUZURI_WASM_LD:-$LLVM_PREFIX/bin/wasm-ld}"
          git fetch --no-tags origin a621fada69bf27f425bfbb012cc7d0a699721db6
          node -e "const fs=require('node:fs'); fs.mkdirSync('target/numeric-ci',{recursive:true}); fs.writeFileSync('target/numeric-ci/before.ll',require('node:child_process').execFileSync('git',['show','a621fada69bf27f425bfbb012cc7d0a699721db6:src/runtime/numeric.ll'],{maxBuffer:64*1024*1024}));"
          export TMPDIR="$PWD/target/numeric-ci"
          node tests/display_parse.mjs target/release/tsuzuri
          node tests/display_parse_exhaustive.mjs --f32-samples 100000 --f64 100000 --jobs 2 --baseline-runtime target/numeric-ci/before.ll
      # D10: tests/f16_hardware.mjs prints the f16 path each build exercised (hardware, conversions or soft)
      # and compares the results with an independent reference. matrix.f16 is the path this runner must
      # take: a CPU that lacks the capability falls back to soft, and TSUZURI_F16_EXPECT turns that
      # fallback into a failure instead of a pass. The AArch64 runners (Apple Silicon, Neoverse) run
      # the full hardware path. The ubuntu-24.04 x86-64 runner must expose F16C, but accepts full hardware
      # when its VM also exposes AVX512-FP16.
      - name: f16 paths
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        env:
          TSUZURI_F16_EXPECT: ${{ matrix.f16 }}
        run: |
          export TSUZURI_CLANG="$LLVM_PREFIX/bin/clang"
          export TSUZURI_WASM_LD="${TSUZURI_WASM_LD:-$LLVM_PREFIX/bin/wasm-ld}"
          node tests/f16_hardware.mjs target/release/tsuzuri
      - uses: actions/setup-go@v7
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        with:
          go-version: "1.27.2"
          cache: false
      - name: Benchmark correctness and metric records
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: |
          export TSUZURI_CLANG="$LLVM_PREFIX/bin/clang"
          export TSUZURI_WASM_LD="${TSUZURI_WASM_LD:-$LLVM_PREFIX/bin/wasm-ld}"
          export TSUZURI_GO="$(command -v go)"
          export TSUZURI_ZIG="$PWD/target/toolchain/zig/zig"
          if [ "$RUNNER_OS" = Linux ]; then /usr/bin/time --version; fi
          node tests/benchmark_report.mjs
          node tests/benchmark_apps.mjs
          node tests/ai_cost.mjs target/release/tsuzuri
          node benchmarks/run-control.mjs target/release/tsuzuri --quick --metrics target/perf/ci-core
          node benchmarks/run-cpp.mjs target/release/tsuzuri --quick --metrics target/perf/ci-core
          node benchmarks/run-computations.mjs target/release/tsuzuri --quick --metrics target/perf/ci-core
          node benchmarks/metrics.mjs process target/release/tsuzuri --quick --out target/perf/ci-core
          node benchmarks/run-tasks.mjs target/release/tsuzuri --quick --metrics target/perf/ci-core
          node benchmarks/run-simd.mjs target/release/tsuzuri --quick --metrics target/perf/ci-core
          node benchmarks/run-dispatch.mjs target/release/tsuzuri --quick --metrics target/perf/ci-core
          node benchmarks/run.mjs target/release/tsuzuri --quick --metrics target/perf/ci-core
          node benchmarks/run-build.mjs target/release/tsuzuri --quick --out target/perf/ci-build
          node benchmarks/run-lto.mjs target/release/tsuzuri --quick --metrics target/perf/ci-core
          node tests/benchmark_list_memory.mjs target/release/tsuzuri
          node benchmarks/run-list-memory.mjs target/release/tsuzuri --quick --wasm --metrics target/perf/ci-core
          node benchmarks/run-apps.mjs target/release/tsuzuri --quick --metrics target/perf/ci-apps
          node benchmarks/metrics.mjs report target/perf/ci-core target/perf/ci-build target/perf/ci-apps
      - name: Frontend benchmark record smoke
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        timeout-minutes: 5
        env:
          RUST_MIN_STACK: "4194304"
          LC_ALL: C
          TSUZURI_CACHE_DIR: ""
        run: node benchmarks/run-frontend.mjs target/release/tsuzuri --out target/perf/ci-frontend --quick
      # PB04: the frontend runs on worker threads, so nothing the compiler prints or writes may depend on TSUZURI_THREADS
      # (diagnostics, IR, exit codes, frontend cache bytes). This replaces PB02's isolated equivalence: that runner overlaid the
      # frontend files of the tree on the sources of a621fada, and since PB04 they need src/parallel.rs and the callers in
      # src/lib.rs (and the later tickets change what the frontend records), so the overlay no longer builds.
      - name: Frontend output independent of the thread count
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        timeout-minutes: 25
        env:
          RUST_MIN_STACK: "4194304"
          LC_ALL: C
          TSUZURI_CACHE_DIR: ""
        run: node tests/parallel_frontend.mjs target/release/tsuzuri
      # PB06: tsuzuri watch and the resident build server. A request must give the same output, exit code and artifacts as the command
      # alone; the socket path of the server must fit sun_path, so TMPDIR is the short runner temp directory.
      - name: Watch mode and the resident build server (PB06)
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        timeout-minutes: 30
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          export TSUZURI_CLANG="$LLVM_PREFIX/bin/clang"
          export TSUZURI_WASM_LD="${TSUZURI_WASM_LD:-$LLVM_PREFIX/bin/wasm-ld}"
          node tests/watch.mjs target/release/tsuzuri
          node tests/server.mjs target/release/tsuzuri
      # PB07: a native -O0 executable or object and a wasm32 module are built from codegen units (TSUZURI_CODEGEN_UNITS). The suite forces the
      # split on small programs and compares it with the single module: behavior, public symbols, the same bytes from the same text, the
      # units that an edit compiles again, and DWARF. LLVM_PREFIX turns its skips (no llvm-dwarfdump, no objcopy, no wasm-ld) into
      # failures. Windows hosts always build one unit and the suite exits there (windows.yml).
      - name: Codegen units (PB07)
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        timeout-minutes: 30
        run: |
          export TSUZURI_CLANG="$LLVM_PREFIX/bin/clang"
          export TSUZURI_WASM_LD="${TSUZURI_WASM_LD:-$LLVM_PREFIX/bin/wasm-ld}"
          export TSUZURI_DWARFDUMP="$LLVM_PREFIX/bin/llvm-dwarfdump"
          export TSUZURI_OBJCOPY="$LLVM_PREFIX/bin/llvm-objcopy"
          node tests/codegen_units.mjs target/release/tsuzuri
      # PB05: --backend fast (Cranelift, and the direct WebAssembly writer) exists only in a build with --features fast-backend, which goes
      # to its own target directory so that target/release/tsuzuri, the binary every step above tested, stays the default one.
      # tests/fast_backend.mjs checks the option table, traps, determinism, object symbols and the cache; "programs" builds every example
      # and fixture with both backends at -O0 and compares output and exit status; "debug" has llvm-dwarfdump verify the -g line tables;
      # server.mjs sends --backend fast through the resident server (TMPDIR is the short runner temp directory for its socket).
      - name: Fast backend (PB05)
        id: fast
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        timeout-minutes: 45
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/fast
          TMPDIR: ${{ runner.temp }}
        run: |
          export TSUZURI_CLANG="$LLVM_PREFIX/bin/clang"
          export TSUZURI_WASM_LD="${TSUZURI_WASM_LD:-$LLVM_PREFIX/bin/wasm-ld}"
          export TSUZURI_DWARFDUMP="$LLVM_PREFIX/bin/llvm-dwarfdump"
          cargo build --release --locked --features fast-backend
          export TSUZURI_FAST_CC="$PWD/target/fast/release/tz-fast-cc"
          node tests/fast_backend.mjs target/fast/release/tsuzuri
          node tests/fast_backend.mjs programs target/fast/release/tsuzuri
          node tests/fast_backend.mjs debug target/fast/release/tsuzuri
          node tests/server.mjs target/fast/release/tsuzuri
      # PM09: the translator turns a musttail call into return_call, so the same mutual recursion runs in constant stack with --backend fast.
      # TSUZURI_STACK_FAST turns a compiler without the backend into a failure instead of a skip.
      - name: Stack depth with the fast backend (PM09)
        if: ${{ !cancelled() && steps.fast.outcome == 'success' }}
        timeout-minutes: 20
        env:
          TMPDIR: ${{ runner.temp }}
          TSUZURI_STACK_FAST: "1"
        run: |
          export TSUZURI_CLANG="$LLVM_PREFIX/bin/clang"
          export TSUZURI_WASM_LD="${TSUZURI_WASM_LD:-$LLVM_PREFIX/bin/wasm-ld}"
          export TSUZURI_OBJDUMP="$LLVM_PREFIX/bin/llvm-objdump"
          export TSUZURI_FAST_CC="$PWD/target/fast/release/tz-fast-cc"
          node tests/stack.mjs target/fast/release/tsuzuri
      # "wasm" builds every project to a module with both backends, validates it and compares imports, exports and behavior in V8;
      # "parity" runs existing suites with every -O0 build forced onto the fast backend (FAST_FORCE=1) and fails on any difference.
      - name: Fast backend, wasm32 and suite parity (PB05)
        if: ${{ !cancelled() && steps.fast.outcome == 'success' }}
        timeout-minutes: 60
        env:
          TMPDIR: ${{ runner.temp }}
          FAST_FORCE: "1"
        run: |
          export TSUZURI_CLANG="$LLVM_PREFIX/bin/clang"
          export TSUZURI_WASM_LD="${TSUZURI_WASM_LD:-$LLVM_PREFIX/bin/wasm-ld}"
          export TSUZURI_FAST_CC="$PWD/target/fast/release/tz-fast-cc"
          export TSUZURI_BIN="$PWD/target/fast/release/tsuzuri"
          node tests/fast_backend.mjs wasm target/fast/release/tsuzuri
          node tests/fast_backend.mjs parity control primitives numeric_casts integer_intrinsics strings user_drop examples e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        with:
          name: benchmark-correctness-${{ matrix.host }}
          path: target/perf/ci-*
          if-no-files-found: error
      # G36: random typed programs run by the constant evaluator, native -O0/-O3 and wasm32 -O0/-O3 against an independent BigInt
      # evaluator, and ownership programs checked for leaks. A difference is minimized and saved under target/progfuzz/failures.
      - name: Whole-language differential fuzz (G36)
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        timeout-minutes: 30
        run: |
          export TSUZURI_CLANG="$LLVM_PREFIX/bin/clang"
          export TSUZURI_WASM_LD="${TSUZURI_WASM_LD:-$LLVM_PREFIX/bin/wasm-ld}"
          node tests/progfuzz.mjs --self-test target/release/tsuzuri
          node tests/progfuzz.mjs target/release/tsuzuri 200 1 4
          TSUZURI_PROGFUZZ_KIND=owned node tests/progfuzz.mjs target/release/tsuzuri 100 1 4
      # A failed --self-test keeps its sources and minimized failures under target/progfuzz/self-test (and the fuzz runs after it
      # do not start), so that subtree is kept too.
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: progfuzz-failures-${{ matrix.host }}
          path: |
            target/progfuzz/failures
            target/progfuzz/self-test
          if-no-files-found: ignore
      # Other tickets' end-to-end steps for these three hosts go here, before the Rust tests: that step takes
      # 25-70 minutes, so it is last and a slow runner cannot cost the results above. Start each step with
      # `if: ${{ !cancelled() }}` so that a failure above does not hide it.
      #
      # The depth-limit tests (parser::tests::bounds_recursive_and_flat_expression_depth,
      # computations::bounds_computation_syntax_and_expansion, ...) feed 200 nested levels to a debug build
      # whose recursive-descent frames take 2.03-2.13 MB, against the 2 MiB (2,097,152 bytes) of a test
      # thread. How far over depends on the target and rustc release: on linux-arm64 (rustc 1.99) two of them
      # overflow on main too and pass from 2.2 MB, and an overflow aborts the whole test binary. The full run
      # takes 4 MiB per test thread (RUST_MIN_STACK, as in GUIDE §9 and the earlier PRs), so that it does not
      # depend on the toolchain; each test still checks that its limit is reported as a diagnostic. (Those frames are
      # from opt-level 0; the dev profile of Cargo.toml has used opt-level 1 since, which makes them smaller, and the
      # 4 MiB stays for the same reason.)
      - name: Rust tests
        if: ${{ !cancelled() }}
        env:
          RUST_MIN_STACK: "4194304"
        run: |
          export TSUZURI_CLANG="$LLVM_PREFIX/bin/clang"
          export TSUZURI_WASM_LD="${TSUZURI_WASM_LD:-$LLVM_PREFIX/bin/wasm-ld}"
          cargo test --locked --no-fail-fast
      # PM03: the whole Rust suite with every program compiled in the compact string form (about 27 minutes), on one host, so that the
      # opt-in mode stays as correct as the default. The tests that pin the UTF-16 IR text fix their form explicitly.
      - name: Rust tests with compact strings (PM03)
        if: ${{ !cancelled() && matrix.host == 'linux-x64' }}
        env:
          RUST_MIN_STACK: "4194304"
          TSUZURI_STRINGS: compact
        run: |
          export TSUZURI_CLANG="$LLVM_PREFIX/bin/clang"
          export TSUZURI_WASM_LD="${TSUZURI_WASM_LD:-$LLVM_PREFIX/bin/wasm-ld}"
          cargo test --locked --no-fail-fast
      # PB05: the unit tests of the library and the binaries and the two integration tests of the fast backend, built with the feature (the
      # run above does not compile src/backend). All three hosts execute the code of their own architecture.
      - name: Rust tests of the fast backend (PB05)
        if: ${{ !cancelled() }}
        env:
          RUST_MIN_STACK: "4194304"
        run: |
          export TSUZURI_CLANG="$LLVM_PREFIX/bin/clang"
          export TSUZURI_WASM_LD="${TSUZURI_WASM_LD:-$LLVM_PREFIX/bin/wasm-ld}"
          cargo test --locked --no-fail-fast --features fast-backend --lib --bins --test fast_backend --test fast_backend_ops
