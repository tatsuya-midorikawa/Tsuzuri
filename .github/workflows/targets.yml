name: Tsuzuri targets

# G15: native targets named with `--target TRIPLE`, cross-linked with the bundled Zig toolchain, and
# the compiler's tests on the four hosts that ship a toolchain bundle. The documentation's tier table
# (_tsuzuri/language-reference/compiler/platforms.md) may claim only what a step of this file checks:
#   - "executed on a matching runner":  the host's own triple, run by tests/targets.mjs on each job;
#   - "executed through an emulator":   the static musl triples, run by qemu-user on the Linux jobs, and
#                                       x86_64-apple-darwin, run by Rosetta on the macos-15 job;
#   - "linked and inspected":           the triples that the Zig bundle links, whose headers are read back;
#   - "object only":                    the triples without a C library in the bundle.
# Windows hosts are not here: tests/windows.rs, tests/windows.mjs and vscode.yml cover them.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/**
      - std/**
      - tests/**
      - benchmarks/**
      - Cargo.*
      - scripts/toolchain/**
      - .github/workflows/targets.yml

permissions:
  contents: read

concurrency:
  group: targets-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  targets:
    name: targets (${{ matrix.host }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            host: darwin-arm64
            f16: hardware
          - os: macos-15-intel
            host: darwin-x64
            f16: generic=soft,native=conversions
          - os: ubuntu-24.04
            host: linux-x64
            f16: generic=soft,native=conversions|hardware
          - os: ubuntu-24.04-arm
            host: linux-arm64
            f16: hardware
    runs-on: ${{ matrix.os }}
    # macos-15-intel takes about 85 minutes (the Rust tests alone 62), the other hosts 35 to 55.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      # The crates, and the Zig archive that scripts/toolchain/bundle.mjs downloads (it verifies the
      # pinned SHA-256 whether or not the file came from here).
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/vsc-downloads
          key: targets-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'scripts/toolchain/bundle.mjs') }}
          restore-keys: targets-${{ runner.os }}-${{ runner.arch }}-
      - name: Check host architecture
        env:
          EXPECTED_HOST: ${{ matrix.host }}
        run: node -e 'if (`${process.platform}-${process.arch}` !== process.env.EXPECTED_HOST) process.exit(1)'
      # LLVM 21 as in vscode.yml: the system Clang that builds the host's programs and every object, and
      # what the bundle copies. The Linux jobs also install qemu-user, which runs the foreign static
      # musl executables through TSUZURI_RUNNER; nothing is downloaded by the tests themselves.
      - name: LLVM on macOS
        if: runner.os == 'macOS'
        run: |
          brew install llvm@21 lld
          printf 'LLVM_PREFIX=%s\n' "$(brew --prefix llvm@21)" >> "$GITHUB_ENV"
          printf 'TSUZURI_WASM_LD=%s/bin/wasm-ld\n' "$(brew --prefix lld)" >> "$GITHUB_ENV"
      - name: LLVM and qemu-user on Linux
        if: runner.os == 'Linux'
        run: |
          sudo -n apt-get update
          sudo -n apt-get install -y ca-certificates wget gnupg patchelf
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor | sudo -n tee /usr/share/keyrings/llvm.gpg >/dev/null
          printf 'deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main\n' | sudo -n tee /etc/apt/sources.list.d/llvm21.list >/dev/null
          sudo -n apt-get update
          sudo -n apt-get install -y clang-21 lld-21 llvm-21 libclang-rt-21-dev qemu-user
          printf 'LLVM_PREFIX=/usr/lib/llvm-21\n' >> "$GITHUB_ENV"
      # target/release/tsuzuri (cargo build --release --locked) and target/toolchain: the compiler, the
      # launcher tsuzuri-clang, LLVM's clang, and Zig, laid out as the VS Code extension ships them.
      - name: Build the compiler and the bundled toolchain
        id: bundle
        run: node scripts/toolchain/bundle.mjs target/toolchain
      # G15: each of the 22 triples reports "executed", "linked only" or "object only". The opt-in
      # variables make a missing cross toolchain or emulator a failure here instead of a skip:
      #   TSUZURI_CROSS_LINK=1     link every target the bundled Zig can link (needs TSUZURI_CROSS_CLANG);
      #   TSUZURI_CROSS_EXECUTE=1  run the static musl targets of the other architectures under qemu-user.
      - name: Targets
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: |
          export TSUZURI_CLANG="$LLVM_PREFIX/bin/clang"
          export TSUZURI_WASM_LD="${TSUZURI_WASM_LD:-$LLVM_PREFIX/bin/wasm-ld}"
          export TSUZURI_CROSS_LINK=1
          export TSUZURI_CROSS_CLANG="$PWD/target/toolchain/bin/tsuzuri-clang"
          if [ "$RUNNER_OS" = Linux ]; then export TSUZURI_CROSS_EXECUTE=1; fi
          node tests/targets.mjs target/release/tsuzuri
      - name: End-to-end compiler tests
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: |
          export TSUZURI_CLANG="$LLVM_PREFIX/bin/clang"
          export TSUZURI_WASM_LD="${TSUZURI_WASM_LD:-$LLVM_PREFIX/bin/wasm-ld}"
          node tests/e2e.mjs target/release/tsuzuri
      - name: Memory and LLVM fact semantics
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        env:
          TSUZURI_CACHE_DIR: ${{ github.workspace }}/target/phase2-cache
        run: |
          export TSUZURI_CLANG="$LLVM_PREFIX/bin/clang"
          export TSUZURI_WASM_LD="${TSUZURI_WASM_LD:-$LLVM_PREFIX/bin/wasm-ld}"
          node tests/features.mjs target/release/tsuzuri storage
          node tests/features.mjs target/release/tsuzuri last_use
          node tests/features.mjs target/release/tsuzuri param_facts
      # PM05: the WASM heap alone, the unit tests of the size-class allocator (plain, ASan+UBSan, TSan), --allocator small end
      # to end, and the vec and storage suites with every block of the size classes accounted for.
      - name: WASM heap and size-class allocator
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: |
          export TSUZURI_CLANG="$LLVM_PREFIX/bin/clang"
          export TSUZURI_WASM_LD="${TSUZURI_WASM_LD:-$LLVM_PREFIX/bin/wasm-ld}"
          export TSUZURI_OBJDUMP="$LLVM_PREFIX/bin/llvm-objdump"
          # Linux runs the unit tests with ASan+UBSan and TSan (libclang-rt-21-dev above). The Homebrew LLVM 21 of the macOS
          # runners builds sanitizer programs that never start (an empty AddressSanitizer program hangs, a ThreadSanitizer
          # one dies with SIGSEGV; vscode.yml leaves them out of the Net tests for the same reason), so macOS runs them
          # without sanitizers: the plain and -O3 unit tests, which always run, decide there.
          if [ "$RUNNER_OS" = macOS ]; then export TSUZURI_NO_SANITIZERS=1; fi
          node tests/wasm_heap.mjs
          node tests/small_allocator.mjs target/release/tsuzuri
          TSUZURI_TEST_ALLOCATOR=small node tests/features.mjs target/release/tsuzuri vec
          TSUZURI_TEST_ALLOCATOR=small node tests/features.mjs target/release/tsuzuri storage
      - name: Last-use differential fuzz smoke
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: |
          export TSUZURI_CLANG="$LLVM_PREFIX/bin/clang"
          node tests/last_use_fuzz.mjs target/release/tsuzuri 40 1 4
      - name: UTF SIMD and scalar fallbacks
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: |
          export TSUZURI_CLANG="$LLVM_PREFIX/bin/clang"
          export TSUZURI_OBJDUMP="$LLVM_PREFIX/bin/llvm-objdump"
          node tests/utf_simd.mjs --quick
      - name: Prebuilt runtime cache and fallback
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: |
          export TSUZURI_CLANG="$LLVM_PREFIX/bin/clang"
          export TSUZURI_WASM_LD="${TSUZURI_WASM_LD:-$LLVM_PREFIX/bin/wasm-ld}"
          node tests/prebuilt_runtime.mjs target/release/tsuzuri
      - name: Numeric display and parse references
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: |
          export TSUZURI_CLANG="$LLVM_PREFIX/bin/clang"
          export TSUZURI_WASM_LD="${TSUZURI_WASM_LD:-$LLVM_PREFIX/bin/wasm-ld}"
          git fetch --no-tags origin a621fada69bf27f425bfbb012cc7d0a699721db6
          node -e "const fs=require('node:fs'); fs.mkdirSync('target/numeric-ci',{recursive:true}); fs.writeFileSync('target/numeric-ci/before.ll',require('node:child_process').execFileSync('git',['show','a621fada69bf27f425bfbb012cc7d0a699721db6:src/runtime/numeric.ll'],{maxBuffer:64*1024*1024}));"
          export TMPDIR="$PWD/target/numeric-ci"
          node tests/display_parse.mjs target/release/tsuzuri
          node tests/display_parse_exhaustive.mjs --f32-samples 100000 --f64 100000 --jobs 2 --baseline-runtime target/numeric-ci/before.ll
      # D10: tests/f16_hardware.mjs prints the f16 path each build exercised (hardware, conversions or soft)
      # and compares the results with an independent reference. matrix.f16 is the path this runner must
      # take: a CPU that lacks the capability falls back to soft, and TSUZURI_F16_EXPECT turns that
      # fallback into a failure instead of a pass. The AArch64 runners (Apple Silicon, Neoverse) run
      # the full hardware path. The ubuntu-24.04 x86-64 runner must expose F16C, but accepts full hardware
      # when its VM also exposes AVX512-FP16; macos-15-intel converts with F16C and keeps arithmetic soft.
      - name: f16 paths
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        env:
          TSUZURI_F16_EXPECT: ${{ matrix.f16 }}
        run: |
          export TSUZURI_CLANG="$LLVM_PREFIX/bin/clang"
          export TSUZURI_WASM_LD="${TSUZURI_WASM_LD:-$LLVM_PREFIX/bin/wasm-ld}"
          node tests/f16_hardware.mjs target/release/tsuzuri
      - uses: actions/setup-go@v7
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        with:
          go-version: "1.27.2"
          cache: false
      - name: Benchmark correctness and metric records
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: |
          export TSUZURI_CLANG="$LLVM_PREFIX/bin/clang"
          export TSUZURI_WASM_LD="${TSUZURI_WASM_LD:-$LLVM_PREFIX/bin/wasm-ld}"
          export TSUZURI_GO="$(command -v go)"
          export TSUZURI_ZIG="$PWD/target/toolchain/zig/zig"
          if [ "$RUNNER_OS" = Linux ]; then /usr/bin/time --version; fi
          node tests/benchmark_report.mjs
          node tests/benchmark_apps.mjs
          node benchmarks/run-control.mjs target/release/tsuzuri --quick --metrics target/perf/ci-core
          node benchmarks/run-cpp.mjs target/release/tsuzuri --quick --metrics target/perf/ci-core
          node benchmarks/run-computations.mjs target/release/tsuzuri --quick --metrics target/perf/ci-core
          node benchmarks/metrics.mjs process target/release/tsuzuri --quick --out target/perf/ci-core
          node benchmarks/run-tasks.mjs target/release/tsuzuri --quick --metrics target/perf/ci-core
          node benchmarks/run-simd.mjs target/release/tsuzuri --quick --metrics target/perf/ci-core
          node benchmarks/run-dispatch.mjs target/release/tsuzuri --quick --metrics target/perf/ci-core
          node benchmarks/run.mjs target/release/tsuzuri --quick --metrics target/perf/ci-core
          node benchmarks/run-build.mjs target/release/tsuzuri --quick --out target/perf/ci-build
          node benchmarks/run-apps.mjs target/release/tsuzuri --quick --metrics target/perf/ci-apps
          node benchmarks/metrics.mjs report target/perf/ci-core target/perf/ci-build target/perf/ci-apps
      - name: Frontend benchmark record smoke
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        timeout-minutes: 5
        env:
          RUST_MIN_STACK: "4194304"
          LC_ALL: C
          TSUZURI_CACHE_DIR: ""
        run: node benchmarks/run-frontend.mjs target/release/tsuzuri --out target/perf/ci-frontend --quick
      - name: Isolated frontend equivalence
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        timeout-minutes: 25
        env:
          RUST_MIN_STACK: "4194304"
          LC_ALL: C
          TSUZURI_CACHE_DIR: ""
        run: |
          git fetch --no-tags --depth=1 origin a621fada69bf27f425bfbb012cc7d0a699721db6
          node benchmarks/check-frontend-equivalence.mjs target/perf/PB02-ci-equivalence --baseline-ref=a621fada69bf27f425bfbb012cc7d0a699721db6 --quick --cli-matrix
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        with:
          name: benchmark-correctness-${{ matrix.host }}
          path: target/perf/ci-*
          if-no-files-found: error
      # Other tickets' end-to-end steps for these four hosts go here, before the Rust tests: that step takes
      # 25-70 minutes, so it is last and a slow runner cannot cost the results above. Start each step with
      # `if: ${{ !cancelled() }}` so that a failure above does not hide it.
      #
      # The depth-limit tests (parser::tests::bounds_recursive_and_flat_expression_depth,
      # computations::bounds_computation_syntax_and_expansion, ...) feed 200 nested levels to a debug build
      # whose recursive-descent frames take 2.03-2.13 MB, against the 2 MiB (2,097,152 bytes) of a test
      # thread. How far over depends on the target and rustc release: on linux-arm64 (rustc 1.99) two of them
      # overflow on main too and pass from 2.2 MB, and an overflow aborts the whole test binary. The full run
      # takes 4 MiB per test thread (RUST_MIN_STACK, as in GUIDE §9 and the earlier PRs), so that it does not
      # depend on the toolchain; each test still checks that its limit is reported as a diagnostic.
      - name: Rust tests
        if: ${{ !cancelled() }}
        env:
          RUST_MIN_STACK: "4194304"
        run: |
          export TSUZURI_CLANG="$LLVM_PREFIX/bin/clang"
          export TSUZURI_WASM_LD="${TSUZURI_WASM_LD:-$LLVM_PREFIX/bin/wasm-ld}"
          cargo test --locked --no-fail-fast
