name: Windows MSVC

# The execution gate of the Windows x64 and Arm64 (MSVC ABI) native targets, on GitHub-hosted
# windows-2022 and windows-11-arm runners with MSVC 14.44 (Visual Studio 2022/2026) and pinned LLVM 21.1.8.
# W1-W8 extend the gate of _features/_completed/G10-windows.md; the tiers in
# _tsuzuri/language-reference/compiler/platforms.md claims only what a step of this file checks.
#   W1 cargo fmt, W2 cargo clippy, W4 the release build, W5 tests/windows.mjs, W6 tests/cache.mjs,
#   W7 tests/examples.mjs, W8 tests/wasm_threads.mjs, and W3 cargo test, which comes last because it is the longest step
#   (40 to 50 minutes before the dev profile of Cargo.toml used opt-level 1): every other step reports first. A step that
#   fails does not hide the ones after it,
#   except that W5-W8 and the numeric casts run the tsuzuri.exe of W4, so a failed W4 skips them.
#   tests/numeric_casts.mjs, a reference record of G10 that passed on the first run, stays as a step.
# The MSVC toolset and the Windows SDK are selected below and checked by Show tools, so the documents that
# name them (README.md, docs/architecture.md, compiler/platforms.md, compiler/usage.md) describe every run:
# an image refresh that drops either of them fails the job instead of changing what the gate checks.
# tests/lsp_sessions.mjs, tests/async.mjs, tests/net.mjs and the PDB and natvis checks run on Windows in
# vscode.yml. The Linux and macOS hosts, and the targets that they cross-compile, are in targets.yml.
# tests/stack.mjs (PM09, guaranteed tail calls) is not a step of this gate: its native half runs a mutual recursion of ten million
# calls, which no Windows run has checked, so targets.yml runs it on the three Linux and macOS hosts and platforms.md claims it for no
# Windows target. cargo test (W3) does run the Rust tests of the IR (tests/tail_recursion.rs, tests/stack_frames.rs).
# This gate runs after every merge to main and, on a pull request, with the label `ci:full` (ci.yml is the gate of every
# pull request). `workflow_dispatch` with `fast` set skips W3, so that a branch reads every other step in about 10 minutes.

on:
  workflow_dispatch:
    inputs:
      fast:
        description: Skip W3 cargo test, which takes 40 to 50 minutes
        type: boolean
        default: false
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: read

# An event for some other label gets a group of its own, so that it cancels nothing (a run with `ci:full` takes over an
# hour); its job is skipped below. A pull request event without the label is skipped too, in the group of its own.
concurrency:
  group: windows-${{ github.ref }}-${{ (github.event.action == 'labeled' && github.event.label.name != 'ci:full') && 'other-label' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    if: ${{ github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'ci:full') && (github.event.action != 'labeled' || github.event.label.name == 'ci:full')) }}
    name: Windows MSVC (${{ matrix.host }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            host: win32-x64
            arch: x64
            vs_directory: '2022'
            installer: LLVM-21.1.8-win64.exe
            checksum: 7a5386c26497db1691f320121e5b113364dd0274b98e55f15f4dbc00c0450113
          - os: windows-11-arm
            host: win32-arm64
            arch: arm64
            vs_directory: '18'
            installer: LLVM-21.1.8-woa64.exe
            checksum: 1a770a49460b73667c1750b79f90e7027ead468f966c5d30e180cae19f61d91e
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      GATE_MSVC_TOOLSET: '14.44'
      GATE_WINDOWS_SDK: '10.0.26100.0'
      GATE_VS_DIRECTORY: ${{ matrix.vs_directory }}
      # The same installer and SHA-256 as vscode.yml.
      LLVM_INSTALLER: ${{ matrix.installer }}
      LLVM_INSTALLER_SHA256: ${{ matrix.checksum }}
    steps:
      # The runner checks out with core.autocrlf=true, which turns the fixtures and src/runtime/*.ll into CRLF.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check host architecture
        env:
          EXPECTED_HOST: ${{ matrix.host }}
        run: node -e 'if (`${process.platform}-${process.arch}` !== process.env.EXPECTED_HOST) process.exit(1)'
      # The only action from outside actions/ and dtolnay/, so it is pinned to the commit of v1.13.0.
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: ${{ matrix.arch }}
          toolset: ${{ env.GATE_MSVC_TOOLSET }}
          sdk: ${{ env.GATE_WINDOWS_SDK }}
      # The runner's own LLVM (C:\Program Files\LLVM) changes with the image, so the gate installs its own. The
      # installer comes from download() of scripts/toolchain/bundle.mjs (AGENTS.md): it verifies the pinned SHA-256
      # whether or not the file came from this cache, skips a source that is silent for 30 seconds, and makes three
      # passes. No public mirror carries this release (TUNA keeps only the newest), so the cache is the second source.
      - uses: actions/cache@v6
        with:
          path: target/llvm-installer
          key: windows-llvm-installer-${{ env.LLVM_INSTALLER_SHA256 }}
      - name: LLVM 21.1.8
        shell: pwsh
        run: |
          $installer = Join-Path $PWD "target\llvm-installer\$env:LLVM_INSTALLER"
          New-Item -ItemType Directory -Force (Split-Path $installer) | Out-Null
          $env:LLVM_INSTALLER_PATH = $installer
          node --input-type=module -e "import { download } from './scripts/toolchain/bundle.mjs'; await download(['https://github.com/llvm/llvm-project/releases/download/llvmorg-21.1.8/' + process.env.LLVM_INSTALLER], process.env.LLVM_INSTALLER_PATH, process.env.LLVM_INSTALLER_SHA256)"
          if ($LASTEXITCODE -ne 0) { throw "LLVM installer download failed: $LASTEXITCODE" }
          $prefix = Join-Path $env:RUNNER_TEMP 'llvm21'
          $process = Start-Process $installer -ArgumentList '/S', "/D=$prefix" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "LLVM installation failed: $($process.ExitCode)" }
          "$prefix\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "TSUZURI_CLANG=$prefix\bin\clang.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TSUZURI_WASM_LD=$prefix\bin\wasm-ld.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
      # The environment of the gate: it fails here, not later with a link error, when the runner image drifts.
      - name: Show tools
        shell: pwsh
        run: |
          $clang = (& $env:TSUZURI_CLANG --version | Select-Object -First 1)
          $clang
          & $env:TSUZURI_WASM_LD --version
          node --version
          rustc -vV
          cargo --version
          $link = (Get-Command link.exe).Source
          "link.exe: $link"
          "VCToolsVersion=$env:VCToolsVersion WindowsSDKVersion=$env:WindowsSDKVersion"
          "OS: $([Environment]::OSVersion.VersionString)"
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfLogicalProcessors | Format-List
          $eol = (git ls-files --eol src/runtime/string.ll)
          $eol
          if ($clang -notmatch 'clang version 21\.1\.8') { throw "expected LLVM 21.1.8, got: $clang" }
          if ($env:VCToolsVersion -notlike "$($env:GATE_MSVC_TOOLSET).*") { throw "expected MSVC toolset $env:GATE_MSVC_TOOLSET, got: $env:VCToolsVersion" }
          if ($env:WindowsSDKVersion.TrimEnd('\') -ne $env:GATE_WINDOWS_SDK) { throw "expected Windows SDK $env:GATE_WINDOWS_SDK, got: $env:WindowsSDKVersion" }
          if ($link -notlike "*\Microsoft Visual Studio\$($env:GATE_VS_DIRECTORY)\*\VC\Tools\MSVC\$($env:VCToolsVersion)\*") { throw "link.exe is not the linker of Visual Studio installation $env:GATE_VS_DIRECTORY MSVC $($env:VCToolsVersion): $link" }
          if ($eol -notmatch 'w/lf') { throw "src/runtime/string.ll is not checked out with LF: $eol" }
      - name: W1 cargo fmt
        run: cargo fmt --all -- --check
      - name: W2 cargo clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: W4 release build
        id: build
        if: ${{ !cancelled() }}
        run: cargo build --release --locked
      - name: W5 Windows MSVC end-to-end
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/windows.mjs target/release/tsuzuri.exe
      - name: W6 build cache
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/cache.mjs target/release/tsuzuri.exe
      - name: W7 examples
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/examples.mjs target/release/tsuzuri.exe
      - name: W8 WASM threads
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/wasm_threads.mjs target/release/tsuzuri.exe
      # PM05: the WASM heap alone, and --allocator small on MSVC (thread-local cache, weak hidden shared state, unit tests).
      - name: PM05 WASM heap and size-class allocator
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          node tests/wasm_heap.mjs
          if ($LASTEXITCODE -ne 0) { throw "WASM heap failed: $LASTEXITCODE" }
          node tests/small_allocator.mjs target/release/tsuzuri.exe
          if ($LASTEXITCODE -ne 0) { throw "Small allocator failed: $LASTEXITCODE" }
      - name: Numeric casts
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/numeric_casts.mjs target/release/tsuzuri.exe
      - name: Memory and LLVM fact semantics
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          TSUZURI_CACHE_DIR: ${{ github.workspace }}/target/phase2-cache
        run: |
          node tests/features.mjs target/release/tsuzuri.exe storage
          if ($LASTEXITCODE -ne 0) { throw "Storage failed: $LASTEXITCODE" }
          node tests/features.mjs target/release/tsuzuri.exe last_use
          if ($LASTEXITCODE -ne 0) { throw "Last-use failed: $LASTEXITCODE" }
          node tests/features.mjs target/release/tsuzuri.exe param_facts
          if ($LASTEXITCODE -ne 0) { throw "Ownership facts failed: $LASTEXITCODE" }
          node tests/features.mjs target/release/tsuzuri.exe list_chunks
          if ($LASTEXITCODE -ne 0) { throw "List chunks failed: $LASTEXITCODE" }
      - name: Last-use differential fuzz smoke
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/last_use_fuzz.mjs target/release/tsuzuri.exe 40 1 4
      - name: UTF SIMD and scalar fallbacks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          TSUZURI_OBJDUMP: llvm-objdump.exe
        run: node tests/utf_simd.mjs --quick
      # PM03 and PM04: how the LLDB formatter reads a string of either form and a list of chunks (a stub of the lldb module, so no LLDB is needed).
      - name: LLDB formatters of strings and lists (PM03, PM04)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          python3 tests/lldb_strings.py
          if ($LASTEXITCODE -ne 0) { throw "LLDB string formatter failed: $LASTEXITCODE" }
          python3 tests/lldb_lists.py
          if ($LASTEXITCODE -ne 0) { throw "LLDB list formatter failed: $LASTEXITCODE" }
      # PB06: tsuzuri watch runs the commands again when a source changes. tsuzuri serve needs Unix domain sockets, so on Windows
      # tests/server.mjs checks its E2000 and that --no-server is accepted.
      - name: Watch mode and the build server (PB06)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          node tests/watch.mjs target/release/tsuzuri.exe
          if ($LASTEXITCODE -ne 0) { throw "Watch failed: $LASTEXITCODE" }
          node tests/server.mjs target/release/tsuzuri.exe
          if ($LASTEXITCODE -ne 0) { throw "Build server failed: $LASTEXITCODE" }
      # PB07: tests/codegen_units.mjs (codegen units of -O0 builds) is not run here. A Windows host always builds one module: the units
      # rely on hidden symbols and a POSIX link, and the suite exits at once on win32. targets.yml runs it on the other hosts.
      - name: Prebuilt runtime cache and fallback
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/prebuilt_runtime.mjs target/release/tsuzuri.exe
      - name: Size levels and artifact size
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/size.mjs target/release/tsuzuri.exe
      - name: Integer text against a Python reference
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tests/integer_format.mjs
      - name: Numeric display and parse references
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          git fetch --no-tags origin a621fada69bf27f425bfbb012cc7d0a699721db6
          if ($LASTEXITCODE -ne 0) { throw "Numeric baseline fetch failed: $LASTEXITCODE" }
          node -e "const fs=require('node:fs'); fs.mkdirSync('target/numeric-ci',{recursive:true}); fs.writeFileSync('target/numeric-ci/before.ll',require('node:child_process').execFileSync('git',['show','a621fada69bf27f425bfbb012cc7d0a699721db6:src/runtime/numeric.ll'],{maxBuffer:64*1024*1024}));"
          if ($LASTEXITCODE -ne 0) { throw "Numeric baseline extraction failed: $LASTEXITCODE" }
          $env:TEMP = Join-Path $PWD 'target\numeric-ci'
          $env:TMP = $env:TEMP
          node tests/display_parse.mjs target/release/tsuzuri.exe
          if ($LASTEXITCODE -ne 0) { throw "Display/Parse failed: $LASTEXITCODE" }
          node tests/display_parse_exhaustive.mjs --f32-samples 100000 --f64 100000 --jobs 2 --baseline-runtime target/numeric-ci/before.ll
          if ($LASTEXITCODE -ne 0) { throw "Numeric differential failed: $LASTEXITCODE" }
      # The depth-limit tests feed 200 nested levels to a dev-profile build (opt-level 1 since the profile in Cargo.toml was
      # tuned; its frames were near the 2 MiB of a test thread at opt-level 0, GUIDE D-45), so the whole run keeps 4 MiB per
      # test thread, as targets.yml does.
      - name: W3 cargo test
        if: ${{ !cancelled() && !inputs.fast }}
        env:
          RUST_MIN_STACK: "4194304"
        run: cargo test --locked --no-fail-fast
